# SmartAttend Reverse Proxy & SSL Configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream fastapi_backend {
    server backend:8002;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS in production
    # Uncomment when SSL is provisioned:
    # return 301 https://$host$request_uri;

    # Development / Staging fallback proxy
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase upload body size for high-res classroom photos
        client_max_body_size 25M;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
